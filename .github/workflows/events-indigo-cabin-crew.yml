# Worker: refreshes events_indigo_cabin_crew with IndiGo cabin crew hiring events once a day (staggered with the other airlines).
name: "Events: IndiGo cabin crew"

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC
  workflow_dispatch:

concurrency: events-indigo-cabin-crew

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/events/indigo_cabin_crew.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
