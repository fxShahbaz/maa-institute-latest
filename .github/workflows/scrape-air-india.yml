# Worker: refreshes jobs_air_india from Air India's careers site once a day (staggered with the other airlines).
name: "Jobs: Air India"

on:
  schedule:
    - cron: "28 0 * * *" # 00:28 UTC
  workflow_dispatch:

concurrency: scrape-air-india

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/air_india.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
