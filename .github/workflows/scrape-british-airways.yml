# Worker: refreshes jobs_british_airways from British Airways's careers site once a day (staggered with the other airlines).
name: "Jobs: British Airways"

on:
  schedule:
    - cron: "20 0 * * *" # 00:20 UTC
  workflow_dispatch:

concurrency: scrape-british-airways

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/british_airways.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
