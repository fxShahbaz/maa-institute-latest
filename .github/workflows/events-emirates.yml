# Worker: refreshes events_emirates with Emirates hiring events once a day (staggered with the other airlines).
name: "Events: Emirates"

on:
  schedule:
    - cron: "12 1 * * *" # 01:12 UTC
  workflow_dispatch:

concurrency: events-emirates

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/events/emirates.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
