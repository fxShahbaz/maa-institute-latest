# Worker: refreshes jobs_flydubai from flydubai's careers site once a day (staggered with the other airlines).
name: "Jobs: flydubai"

on:
  schedule:
    - cron: "16 0 * * *" # 00:16 UTC
  workflow_dispatch:

concurrency: scrape-flydubai

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/flydubai.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
