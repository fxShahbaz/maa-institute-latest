# Worker: refreshes events_air_arabia with Air Arabia hiring events once a day (staggered with the other airlines).
name: "Events: Air Arabia"

on:
  schedule:
    - cron: "24 1 * * *" # 01:24 UTC
  workflow_dispatch:

concurrency: events-air-arabia

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/events/air_arabia.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
