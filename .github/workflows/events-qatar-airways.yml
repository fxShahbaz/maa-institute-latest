# Worker: refreshes events_qatar_airways with Qatar Airways hiring events once a day (staggered with the other airlines).
name: "Events: Qatar Airways"

on:
  schedule:
    - cron: "16 1 * * *" # 01:16 UTC
  workflow_dispatch:

concurrency: events-qatar-airways

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/events/qatar_airways.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
