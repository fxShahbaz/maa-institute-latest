# Worker: refreshes jobs_star_air from Star Air's careers site once a day (staggered with the other airlines).
name: "Jobs: Star Air"

on:
  schedule:
    - cron: "48 0 * * *" # 00:48 UTC
  workflow_dispatch:

concurrency: scrape-star-air

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/star_air.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
