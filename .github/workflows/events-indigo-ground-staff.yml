# Worker: refreshes events_indigo_ground_staff with IndiGo ground staff hiring events once a day (staggered with the other airlines).
name: "Events: IndiGo ground staff"

on:
  schedule:
    - cron: "4 1 * * *" # 01:04 UTC
  workflow_dispatch:

concurrency: events-indigo-ground-staff

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/scrapers/events/indigo_ground_staff.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
